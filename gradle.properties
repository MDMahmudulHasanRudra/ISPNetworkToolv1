# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2 -XX:+UnlockDiagnosticVMOptions -XX:-UseChaCha20Intrinsics --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.nio.file=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED -Duser.home=C:/Users/Rudra/AndroidStudioProjects/ISPNetworkToolv1

# Force TLS 1.2 and disable problematic ciphers to avoid JDK 25 TLS 1.3 tag mismatch bug
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.jdk.tls.disabledAlgorithms=TLSv1.3, ChaCha20, RC4, DES, MD5

# Android Build System settings
android.user.home=C:/Users/Rudra/AndroidStudioProjects/ISPNetworkToolv1/.android
android.overridePathCheck=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# Disable configuration cache to avoid AndroidLocationsBuildService serialization errors on Java 25
org.gradle.configuration-cache=false
